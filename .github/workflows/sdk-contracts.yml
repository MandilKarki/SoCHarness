name: SDK contract tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYDANTIC_AI_NO_BANNER: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-agents.txt
      - run: python -m pip check
      - run: npm install --global npm@12.2.0 --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: workers/agent-bridge
      - run: python -m unittest discover -s services -p "test_*.py" -v
      - run: node --test test/adapters.test.mjs
        working-directory: workers/agent-bridge
