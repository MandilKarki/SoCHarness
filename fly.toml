# Protected single-operator pilot. Never scale SQLite across independent Machines.
app = "socharness-mandil"
primary_region = "yyz"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  RELAY_MODE = "pilot"
  RELAY_PUBLIC_ORIGIN = "https://socharness-mandil.fly.dev"
  RELAY_DATA_DIR = "/data"
  RELAY_MAX_RUNS = "1"
  RELAY_BOOTSTRAP_WAIT = "0"
  PORT = "8787"

[[mounts]]
  source = "relay_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 16
    hard_limit = 24

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/api/health"
    [http_service.checks.headers]
      Host = "socharness-mandil.fly.dev"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "2gb"
