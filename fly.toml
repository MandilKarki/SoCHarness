# TEMPLATE: choose your own unique app name and matching HTTPS origin before deploying.
app = "relay-isoc-replace-me"
primary_region = "sea"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  RELAY_MODE = "pilot"
  RELAY_PUBLIC_ORIGIN = "https://relay-isoc-replace-me.fly.dev"
  RELAY_DATA_DIR = "/data"
  RELAY_MAX_RUNS = "2"
  PORT = "8787"

[[mounts]]
  source = "relay_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 16
    hard_limit = 24

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/api/health"
    [http_service.checks.headers]
      Host = "relay-isoc-replace-me.fly.dev"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "2gb"
